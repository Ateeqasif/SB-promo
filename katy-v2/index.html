 :root{
  --bg:#FFFFFF;
  --ink:#212529;
  --serif-ink:#212529;
  --muted:#595959;
  --muted-2:#767676;
  --orange:#F18605;
  --orange-dark:#E06D07;
  --gold:#FFB703;
  --gold-soft:#FFB703;
  --accent:#FFB703;
  --green:#285430;
  --red:#FF5757;
  --sea:#1C9EC9;
  --light-green:#D2E8AB;
  --light-blue:#B5E2FA;
  --dark:#212529;
  --dark-2:#3B3B3B;
  --card:#FFFFFF;
  --range-card:#FFF7E0;
  --range-check:#D2E8AB;
  --line:#EAEAEA;
  --line-2:#EAEAEA;
  --gold-grad:linear-gradient(135deg,#F18605 0%,#E06D07 100%);
  --dark-grad:linear-gradient(135deg,#3B3B3B 0%,#212529 100%);
  --sans:'Montserrat',Arial,sans-serif;
  --serif:'Neue Regrade',Montserrat,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.5}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input{font-family:inherit}
.wrap{max-width:1200px;margin:0 auto;padding:0 32px}
.promo-bar{background:var(--gold-grad);color:#fff}
.promo-inner{display:flex;align-items:center;justify-content:space-between;gap:16px;height:40px;font-size:13.5px;font-weight:600}
.promo-phone{display:inline-flex;align-items:center;gap:7px;color:#fff;white-space:nowrap}
.promo-phone:hover{opacity:.88}
@media(max-width:520px){
  .promo-inner{justify-content:center}
  .promo-text{display:none}
}
.serif{font-family:var(--serif)}
.label{font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);font-weight:600}

/* ---------- HEADER ---------- */
header.site{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid var(--line-2)}
.nav{display:flex;align-items:center;height:74px;gap:22px}
.logo{display:inline-flex;align-items:center;border:2px solid #111;border-radius:8px;padding:6px 13px;font-weight:800;letter-spacing:.06em;font-size:16px;color:#111;white-space:nowrap;flex:0 0 auto;line-height:1}
.logo .thin{font-weight:500;letter-spacing:.16em}
.logo .bold{font-weight:800;letter-spacing:.10em}
.menu{display:flex;align-items:center;gap:18px;margin-left:auto}
.menu-item{position:relative}
.menu-link{display:inline-flex;align-items:center;gap:5px;font-size:14.5px;font-weight:500;color:#2b2b2b;padding:8px 0}
.menu-link:hover{color:var(--accent)}
.caret{transition:transform .2s}
.menu-item:hover .caret{transform:rotate(180deg)}
.dropdown{position:absolute;top:100%;left:-14px;min-width:190px;background:#fff;border:1px solid var(--line-2);border-radius:10px;box-shadow:0 18px 40px rgba(0,0,0,.10);padding:8px;opacity:0;visibility:hidden;transform:translateY(6px);transition:.18s}
.menu-item:hover .dropdown{opacity:1;visibility:visible;transform:translateY(0)}
.dropdown a{display:block;padding:9px 12px;font-size:14px;border-radius:7px;color:#3a3a3a}
.dropdown a:hover{background:var(--range-card);color:var(--accent)}
.btn-consult{background:#111;color:#fff;font-size:13px;font-weight:600;letter-spacing:.04em;text-transform:none;padding:8px 8px;border-radius:6px;transition:.2s;white-space:nowrap;flex:0 0 auto;margin-left:auto}
.btn-consult:hover{background:#000;transform:translateY(-1px)}
.hamburger{display:none;flex-direction:column;gap:5px;padding:8px;flex:0 0 auto}
.hamburger span{width:24px;height:2px;background:#222;border-radius:2px}

/* ---------- HERO ---------- */
.hero{position:relative;overflow:hidden}
.hero-bg{position:absolute;inset:0;background-size:auto;background-position:center right;background-repeat:no-repeat}
.hero-bg::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(33,37,41,.82) 0%,rgba(33,37,41,.68) 30%,rgba(33,37,41,.40) 52%,rgba(33,37,41,.14) 78%,rgba(33,37,41,.02) 100%)}
.hero-inner{position:relative;display:grid;grid-template-columns:1.05fr .95fr;gap:48px;align-items:start;padding:35px 0 5px}
.rating{display:inline-flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:40px;padding:9px 18px;font-size:14px;color:#3b3b3b;box-shadow:0 6px 18px rgba(0,0,0,.05);margin-bottom:30px}
.rating b{color:#4285F4;font-weight:600}
.rating .star{color:#f5b800}
.hero h1{font-family:var(--sans);font-weight:800;font-size:64px;line-height:1.02;letter-spacing:-.02em;color:#fff}
.hero h1 .accent{color:var(--accent)}
.hero .sub{font-size:22px;font-weight:600;color:#fff;margin-top:10px;line-height:1.35;max-width:520px}
.hero .lead{font-size:16px;color:rgba(255,255,255,.82);margin-top:18px;max-width:520px;line-height:1.7}
.call-btn{display:inline-flex;align-items:center;gap:14px;background:var(--dark-grad);color:#fff;border-radius:12px;padding:14px 26px 14px 16px;margin-top:30px;box-shadow:0 12px 30px rgba(29,24,21,.28)}
.call-btn .ic{width:42px;height:42px;border-radius:9px;background:rgba(255,255,255,.12);display:grid;place-items:center;flex:0 0 auto}
.call-btn small{display:block;font-size:12px;color:#d9cdbd;letter-spacing:.04em}
.call-btn strong{display:block;font-size:19px;font-weight:700;letter-spacing:.02em}

/* ---------- FORM CARD ---------- */
.form-card{background:#fff;border:1px solid var(--line-2);border-radius:16px;box-shadow:0 30px 70px rgba(29,24,21,.12);padding:34px}
.fc-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px}
.fc-title{font-family:var(--serif);font-size:32px;font-weight:600;color:var(--serif-ink);line-height:1.15;max-width:330px}
.step-chip{font-size:13px;color:var(--muted-2);white-space:nowrap;padding-top:6px}
.fc-q{font-size:14.5px;font-weight:700;color:#2b2b2b;margin:26px 0 14px}
.pills{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pill{border:1px solid var(--line);background:#fff;border-radius:9px;padding:14px 8px;font-size:14.5px;color:#3a3a3a;transition:.15s;text-align:center}
.pill:hover{border-color:var(--gold)}
.pill.on{border-color:var(--gold);background:#faf5ea;color:var(--ink);font-weight:600;box-shadow:0 0 0 1px var(--gold) inset}
.field{position:relative;margin-top:14px}
.field .fic{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:#b7a98e}
.field input{width:100%;border:1px solid var(--line);border-radius:9px;padding:15px 16px 15px 46px;font-size:15px;color:#2b2b2b;background:#fff;transition:.15s}
.field input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(189,154,90,.14)}
.field input::placeholder{color:#a9a9a9}
.get-started{width:100%;margin-top:22px;background:var(--gold-grad);color:#fff;font-weight:700;letter-spacing:.05em;text-transform:uppercase;font-size:14px;padding:16px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;gap:9px;box-shadow:0 14px 30px rgba(189,154,90,.35);transition:.2s}
.get-started:hover{filter:brightness(1.04);transform:translateY(-1px)}
.back-link{margin-top:16px;font-size:13.5px;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.back-link:hover{color:var(--accent)}
.success{text-align:center;padding:20px 6px}
.success .tick{width:66px;height:66px;border-radius:50%;background:#f3ecdd;display:grid;place-items:center;margin:6px auto 20px}
.success h3{font-family:var(--serif);font-size:30px;font-weight:600;color:var(--serif-ink)}
.success p{color:var(--muted);margin-top:12px;font-size:15px;line-height:1.65}
.err{color:#c0392b;font-size:12.5px;margin-top:6px}

/* ---------- RANGE ---------- */
section{position:relative}
.pad{padding:40px 0}
.range h2{font-family:var(--serif);font-size:46px;font-weight:600;color:var(--serif-ink);margin:14px 0 22px;line-height:1.1}
.range .intro{font-size:17px;color:var(--muted);max-width:640px;line-height:1.6}
.range-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin-top:34px}
.range-card{display:flex;align-items:center;gap:16px;min-height:50px;background:#FFFBEF;border:1px solid #eee3d0;border-radius:14px;padding:7px 14px;transition:.15s}
.range-card:hover{transform:translateY(-2px);box-shadow:0 12px 26px rgba(0,0,0,.06)}
.range-card .chk{width:38px;height:38px;border-radius:50%;background:var(--range-check);display:grid;place-items:center;flex:0 0 auto;color:#2d6b4f}
.range-card span{font-size:16px;font-weight:500;color:#2f2a25;line-height:1.35}
.range .outro{font-size:16px !important;color:var(--muted);max-width:-webkit-fill-available;margin-top:30px;line-height:1.6}

/* ---------- SLIDER ---------- */
.fit{text-align:center}
.fit h2{font-family:var(--serif);font-size:48px;font-weight:500;color:var(--serif-ink);margin-top:14px}
.slide{display:grid;grid-template-columns:1fr 1fr;gap:0;margin-top:48px;border-radius:16px;overflow:hidden;background:#fff;border:1px solid var(--line-2);text-align:left;box-shadow:0 24px 60px rgba(0,0,0,.06)}
.slide-body{padding:54px 48px}
.slide-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:30px}
.slide-num{font-size:15px;letter-spacing:.18em;color:#9a9a9a;font-weight:500}
.dots{display:flex;gap:8px}
.dot{width:26px;height:4px;border-radius:3px;background:#e4ddce;transition:.2s}
.dot.on{background:var(--gold);width:34px}
.slide h3{font-family:var(--serif);font-size:38px;font-weight:600;color:var(--serif-ink);line-height:1.12}
.slide p{font-size:16px;color:var(--muted);line-height:1.75;margin-top:20px}
.read-more{margin-top:22px;color:var(--gold);font-weight:600;font-size:15px;display:inline-flex;align-items:center;gap:7px}
.read-more .caret{transition:transform .2s}
.read-more.open .caret{transform:rotate(180deg)}
.slide-foot{display:flex;align-items:center;gap:20px;margin-top:38px}
.arrow{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;color:#555;transition:.15s;background:#fff}
.arrow:hover{border-color:var(--gold);color:var(--accent)}
.explore{font-size:14px;color:#4a4a4a;font-weight:500}
.slide-img{position:relative;min-height:460px;background-size:cover;background-position:center}
.slide-img .cap{position:absolute;left:0;right:0;bottom:0;padding:22px 26px;color:#fff;font-weight:700;letter-spacing:.14em;font-size:14px;background:linear-gradient(0deg,rgba(0,0,0,.55),rgba(0,0,0,0))}

/* ---------- CTA DARK ---------- */
.cta{background:var(--dark-2);color:#fff;text-align:center;padding:88px 0}
.cta h2{font-family:var(--serif);font-size:48px;font-weight:500}
.cta p{color:#c7bdb2;max-width:640px;margin:22px auto 0;font-size:17px;line-height:1.6}
.cta-btns{display:flex;gap:14px;justify-content:center;margin-top:34px;flex-wrap:wrap}
.cta-gold{background:var(--gold-grad);color:#fff;font-weight:600;font-size:16px;padding:17px 30px;border-radius:9px;display:inline-flex;align-items:center;gap:11px;box-shadow:0 14px 30px rgba(189,154,90,.3);transition:.2s}
.cta-gold:hover{transform:translateY(-1px);filter:brightness(1.05)}
.cta-out{border:1px solid rgba(255,255,255,.35);color:#fff;font-weight:600;font-size:16px;padding:17px 30px;border-radius:9px;display:inline-flex;align-items:center;gap:11px;transition:.2s}
.cta-out:hover{background:rgba(255,255,255,.08);border-color:#fff}

/* ---------- FAQ ---------- */
.faq{text-align:center}
.faq h2{font-family:var(--serif);font-size:48px;font-weight:500;color:var(--serif-ink);margin-top:12px}
.faq-list{max-width:920px;margin:44px auto 0;text-align:left;display:flex;flex-direction:column;gap:14px}
.faq-item{background:#fff;border:1px solid var(--line-2);border-radius:12px;overflow:hidden;transition:.2s}
.faq-q{width:100%;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:22px 26px;font-size:17px;font-weight:500;color:#2b2622;text-align:left}
.faq-q .fcaret{color:#9a9a9a;transition:transform .25s;flex:0 0 auto}
.faq-item.open .faq-q .fcaret{transform:rotate(180deg);color:var(--gold)}
.faq-a{max-height:0;overflow:hidden;transition:max-height .3s ease;padding:0 26px}
.faq-item.open .faq-a{max-height:260px;padding-bottom:24px}
.faq-a p{color:var(--muted);font-size:16px;line-height:1.7}
.faq-a b{color:var(--ink);font-weight:600}

/* ---------- FOOTER ---------- */
footer.site{background:var(--dark-2);color:#cfc6bb;padding:72px 0 0}
.foot-grid{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr 1fr;gap:36px}
.foot-logo{display:inline-flex;border:2px solid var(--gold);border-radius:8px;padding:7px 14px;font-weight:800;color:#fff;letter-spacing:.06em;font-size:15px}
.foot-logo .thin{font-weight:500;letter-spacing:.16em}
.foot-about{font-size:14.5px;line-height:1.7;color:#b3a99e;margin-top:20px;max-width:290px}
.socials{display:flex;gap:12px;margin-top:22px}
.socials a{width:38px;height:38px;border-radius:50%;border:1px solid rgba(255,255,255,.18);display:grid;place-items:center;color:#cfc6bb;transition:.15s}
.socials a:hover{border-color:var(--gold);color:#fff}
.foot-phone{display:inline-flex;align-items:center;gap:10px;color:var(--gold);font-weight:600;margin-top:24px}
.foot-col h4{color:#fff;font-size:13px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;margin-bottom:18px}
.foot-col a{display:block;font-size:14.5px;color:#b3a99e;padding:6px 0;transition:.15s}
.foot-col a:hover{color:#fff}
.foot-bottom{border-top:1px solid rgba(255,255,255,.10);margin-top:56px;padding:24px 0;display:flex;justify-content:space-between;align-items:center;gap:16px;font-size:13.5px;color:#8f867c}
.foot-bottom .links{display:flex;gap:26px}
.foot-bottom .links a:hover{color:#fff}

/* ---------- RESPONSIVE ---------- */
@media(max-width:1180px){
  .hero h1{font-size:clamp(42px,5.4vw,60px)}
  .menu{gap:18px}
}
@media(max-width:1080px){
  .range-grid{grid-template-columns:1fr 1fr}
  .foot-grid{grid-template-columns:1.4fr 1fr 1fr;row-gap:34px}
}
@media(max-width:980px){
  .menu{display:none}
  .btn-consult{display:inline-flex !important;align-items:center;justify-content:center}
  .hamburger{display:flex}
  .hero-inner{grid-template-columns:1fr;gap:34px;padding:40px 0 56px}
  .hero h1{font-size:clamp(36px,8vw,50px)}
  .hero .sub{font-size:19px}
  .hero-bg{background-position:center}
  .hero-bg::after{background:linear-gradient(180deg,rgba(33,37,41,.40) 0%,rgba(33,37,41,.68) 45%,rgba(33,37,41,.82) 100%)}
  .slide{grid-template-columns:1fr}
  .slide-body{padding:38px 30px}
  .slide-img{min-height:260px;order:2}
  .slide h3{font-size:32px}
  .foot-grid{grid-template-columns:1fr 1fr;gap:28px}
  .range h2,.fit h2,.cta h2,.faq h2{font-size:clamp(30px,6vw,40px)}
  .wrap{padding:0 20px}
  .pad{padding:30px 0}
  .cta{padding:72px 0}
  .form-card{padding:24px}
  .fc-title{font-size:26px}
}
@media(max-width:640px){
  .foot-grid{grid-template-columns:1fr 1fr}
  .foot-about{max-width:100%}
  .call-btn{width:100%}
  .faq-q{font-size:15.5px;padding:18px 20px}
  .faq-a{padding:0 20px}
  .cta-btns{flex-direction:column;align-items:stretch}
  .cta-gold,.cta-out{justify-content:center;width:100%}
  .range-grid{grid-template-columns:1fr;gap:14px}
  .range-card{min-height:96px;flex-direction:row;justify-content:flex-start;text-align:left;padding:18px 24px;gap:16px}
  .range-card .chk{width:48px;height:48px}
  .range-card span{font-size:16px}
  .range .intro{font-size:16px}
  .range .outro{font-size:15.5px}
  .btn-consult{font-size:11.5px;padding:11px 12px;letter-spacing:.02em;margin-left:auto}
  .nav{gap:8px}
  .logo{font-size:13px;padding:7px 10px}
}
@media(max-width:460px){
  .pills{grid-template-columns:1fr 1fr}
  .foot-grid{grid-template-columns:1fr}
  .foot-bottom{flex-direction:column;text-align:center}
  .foot-bottom .links{flex-wrap:wrap;justify-content:center;gap:16px}
  .nav{height:64px}
  .logo{font-size:12.5px;padding:7px 9px}
  .btn-consult{font-size:10.5px;padding:10px 9px}
  .hero .sub{font-size:18px}
  .slide-body{padding:30px 22px}
  .slide h3{font-size:27px}
  .range-card{        min-height: 50px;
        padding: 7px 8px;}
  .range-card .chk{width:44px;height:44px}
}
.mobile-menu{display:none}
.mobile-menu.show{display:block;background:#fff;border-bottom:1px solid var(--line-2);padding:12px 20px 20px}
.mobile-menu a{display:block;padding:12px 4px;font-size:15px;border-bottom:1px solid var(--line-2);color:#333}

/* Final header/logo/mobile corrections */
.logo-image{border:0!important;padding:0!important;border-radius:0!important;background:transparent!important;display:inline-flex!important;align-items:center!important;flex:0 0 auto}
.logo-image img{display:block;width:170px;height:28px;object-fit:contain}
.foot-logo-image{border:0!important;padding:0!important;border-radius:0!important;background:transparent!important}
.foot-logo-image img{display:block;width:190px;height:auto;object-fit:contain;filter:brightness(0) invert(1)}
.range-card{background:#FFFBEF!important}
.mobile-menu .mobile-consult{display:none}
@media(max-width:980px){
  .site .nav{display:flex;align-items:center;gap:12px;height:64px}
  .site .nav .logo-image{margin-right:auto}
  .site .nav .btn-consult{display:none!important}
  .site .nav .hamburger{display:flex!important}
  .mobile-menu{display:none!important}
  .mobile-menu.show{display:block!important;background:#fff;border-bottom:1px solid var(--line-2);padding:8px 20px 16px;box-shadow:0 10px 20px rgba(0,0,0,.05)}
  .mobile-menu a{display:block;padding:13px 4px;font-size:16px!important;line-height:22px;border-bottom:1px solid var(--line-2);color:#333;text-decoration:none}
  .mobile-menu .mobile-consult{display:flex!important;margin-top:14px;padding:13px 16px!important;background:#111;color:#fff!important;border:0;border-radius:6px;align-items:center;justify-content:center;font-weight:600}
  .slide-img{order:2!important}
}
@media(max-width:520px){
  .site .nav{gap:10px}
  .logo-image img{width:150px;height:auto}
}
@media(max-width:360px){
  .logo-image img{width:138px}
}

  {
    q: "Do you install the blinds and shades?",
    a: <p>Yes. Custom measurement and professional installation are part of the service.</p>
  }
];
const FOOT = {
  COLLECTIONS:["Vara","Rassa","Gamana"],
  EXPLORE:["Blinds","Shades","Shutters","Drapes","Motorization","Outdoor"],
  COMPANY:["Become a Dealer","About Us","Warranty","Contact Us","FAQ"],
  SUPPORT:["Free Consultation","Service Areas","Reviews","Financing","Refer a Friend"]
};

/* ---------- header ---------- */
function Header(){
  const [open,setOpen]=useState(false);
  return (
    <>
    <div className="promo-bar">
      <div className="wrap promo-inner">
        <span className="promo-text">Become a Slick Blinds Dealer</span>
        <a href={"tel:"+PHONE} className="promo-phone"><IcPhone s={16}/> {PHONE}</a>
      </div>
    </div>
    <header className="site">
      <div className="wrap">
        <div className="nav">
          <a href="/" className="logo logo-image" aria-label="Slick Blinds"><img src="https://slickblinds.com/_next/image/?url=https%3A%2F%2Fslickblindsprod.blob.core.windows.net%2Fassets%2Fassets%2Fslick_Blinds_Logo_2499f82cff.svg&w=256&q=75" alt="Slick Blinds" width="170" height="28" /></a>
          <nav className="menu">
            {NAV.map((m,i)=>(
              <div className="menu-item" key={i}>
                <a className="menu-link" href={m.href || "#"}>{m.t}{m.sub && <IcCaret className="caret"/>}</a>
                {m.sub && <div className="dropdown">{m.sub.map((s,j)=><a href={m.href || "#"} key={j}>{s}</a>)}</div>}
              </div>
            ))}
          </nav>
          <a href="#consult" className="btn-consult" style={{display:"inline-block"}}>Free Consultation</a>
          <button className="hamburger" onClick={()=>setOpen(!open)} aria-label="menu"><span/><span/><span/></button>
        </div>
      </div>
      <div className={"mobile-menu"+(open?" show":"")} aria-hidden={!open}>
        {NAV.map((m,i)=><a href={m.href || "#"} key={i} onClick={()=>setOpen(false)}>{m.t}</a>)}
        <a className="mobile-consult" href="#consult" onClick={()=>setOpen(false)}>Free Consultation</a>
      </div>
    </header>
    </>
  );
}

/* ---------- 2-step form ---------- */
function ConsultForm(){
  const [step,setStep]=useState(1);
  const [sel,setSel]=useState([]);
  const [f,setF]=useState({address:"",zip:"",name:"",email:"",phone:""});
  const [err,setErr]=useState({});
  const [done,setDone]=useState(false);
  const set=(k)=>(e)=>setF({...f,[k]:e.target.value});
  const toggle=(p)=>setSel(sel.includes(p)?sel.filter(x=>x!==p):[...sel,p]);

  const submit=async()=>{
    const e={};
    if(!f.name.trim()) e.name="Please enter your name";
    if(!/^\S+@\S+\.\S+$/.test(f.email)) e.email="Please enter a valid email";
    if(f.phone.replace(/\D/g,"").length<7) e.phone="Please enter a valid phone";
    setErr(e);
    if(Object.keys(e).length) return;
    const payload={...f, interests:sel};
    if(FORM_ENDPOINT){
      try{await fetch(FORM_ENDPOINT,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});}catch(x){}
    }
    setDone(true);
  };

  if(done) return (
    <div className="form-card" id="consult">
      <div className="success">
        <div className="tick" style={{color:"var(--gold)"}}><IcCheck/></div>
        <h3>Thank you!</h3>
        <p>Your request has been received. A Slick Blinds design consultant will reach out shortly to schedule your free in-home consultation.</p>
      </div>
    </div>
  );

  return (
    <div className="form-card" id="consult">
      <div className="fc-head">
        <div className="fc-title">Request a free in-home design consultation</div>
        <div className="step-chip">Step {step} of 2</div>
      </div>

      {step===1 && <>
        <div className="fc-q">What are you looking to transform today?</div>
        <div className="pills">
          {PILLS.map(p=><button key={p} className={"pill"+(sel.includes(p)?" on":"")} onClick={()=>toggle(p)}>{p}</button>)}
        </div>
        <div className="fc-q">Your area helps us serve you better</div>
        <div className="field"><span className="fic"><IcHome/></span><input placeholder="Address Line" value={f.address} onChange={set("address")}/></div>
        <div className="field"><span className="fic"><IcPin/></span><input placeholder="Zipcode" value={f.zip} onChange={set("zip")}/></div>
        <button className="get-started" onClick={()=>setStep(2)}>Get Started <IcArrow/></button>
      </>}

      {step===2 && <>
        <div className="fc-q" style={{marginTop:24}}>A few details and we'll be in touch</div>
        <div className="field"><span className="fic"><IcUser/></span><input placeholder="Full Name" value={f.name} onChange={set("name")}/></div>
        {err.name && <div className="err">{err.name}</div>}
        <div className="field"><span className="fic"><IcMail/></span><input placeholder="Email Address" value={f.email} onChange={set("email")}/></div>
        {err.email && <div className="err">{err.email}</div>}
        <div className="field"><span className="fic"><IcPhone s={18}/></span><input placeholder="Phone Number" value={f.phone} onChange={set("phone")}/></div>
        {err.phone && <div className="err">{err.phone}</div>}
        <button className="get-started" onClick={submit}>Submit Request <IcArrow/></button>
        <button className="back-link" onClick={()=>setStep(1)}><IcArrow left/> Back</button>
      </>}
    </div>
  );
}

/* ---------- hero ---------- */
function Hero(){
  return (
    <section id="about" className="hero">
      <div className="hero-bg" style={{backgroundImage:"url("+HERO_IMG+")"}}/>
      <div className="wrap">
        <div className="hero-inner">
          <div>
            <div className="rating"><b>Google</b> <span className="star">★</span> Rated 4.9/5 by 1000's of happy homes</div>
            <h1>Custom Blinds & Shades in <span className="accent">Katy &amp; Cinco Ranch</span></h1>
            <div className="sub">Window Treatments Made for Your Home, Your Light, Your Life</div>
            <p className="lead">Your windows are part of how your home feels throughout the day. We help homeowners in Katy and Cinco Ranch choose custom blinds and shades that bring together light control, privacy, comfort and design.</p>
             <p className="lead">From large living-room windows and two-story spaces to bedrooms that need better light control, every treatment is measured and made for the window it belongs to.
</p>
            <a className="call-btn" href={"tel:"+PHONE}>
              <span className="ic"><IcPhone s={20}/></span>
              <span><small>Call us on</small><strong>{PHONE}</strong></span>
            </a>
          </div>
          <ConsultForm/>
        </div>
      </div>
    </section>
  );
}

/* ---------- range ---------- */
function Range(){
  return (
    <section id="range" className="pad range">
      <div className="wrap">
        <div className="label">Our Range</div>
        <h2>Custom Blinds &amp; Shades for Katy Homes</h2>
        <p className="intro">Choose from a considered range of window treatments, including:</p>
        <div className="range-grid">
          {RANGE.map(r=>(
            <div className="range-card" key={r}><span className="chk"><IcCheck/></span><span>{r}</span></div>
          ))}
        </div>
        <p className="outro">Whether you want a clean, contemporary look or something warmer and more layered, we help you find the right combination for your home.</p>
      </div>
    </section>
  );
}

/* ---------- slider ---------- */
function Slider(){
  const [i,setI]=useState(0);
  const [rm,setRm]=useState(false);

  const s=SLIDES[i];

  const go=(d)=>{
    setRm(false);
    setI((i+d+SLIDES.length)%SLIDES.length);
  };

  return (
    <section id="fit" className="pad fit">
      <div className="wrap">

        <div className="label">A More Thoughtful Fit</div>

        <h2>Made for the way your home feels</h2>

        <div className="slide">

          <div className="slide-body">

            <div className="slide-top">
              <div className="slide-num">{s.n}</div>

              <div className="dots">
                {SLIDES.map((_,k)=>(
                  <span
                    key={k}
                    className={"dot"+(k===i?" on":"")}
                    onClick={()=>{
                      setRm(false);
                      setI(k);
                    }}
                    style={{cursor:"pointer"}}
                  />
                ))}
              </div>
            </div>

            <h3>{s.t}</h3>

            <div className="slide-copy">

              {/* First paragraph */}
              <p>{s.p}</p>

              {/* Read More content */}
              {rm && s.more && (
                <p>{s.more}</p>
              )}

              {/* Third paragraph */}
              {rm && s.end && (
                <p>{s.end}</p>
              )}

            </div>

            <button
              className={"read-more"+(rm?" open":"")}
              onClick={()=>setRm(!rm)}
            >
              {rm ? "Read Less" : "Read More"}
              <IcCaret className="caret"/>
            </button>

            <div className="slide-foot">

              <button
                className="arrow"
                onClick={()=>go(-1)}
                aria-label="prev"
              >
                <IcArrow left/>
              </button>

              <button
                className="arrow"
                onClick={()=>go(1)}
                aria-label="next"
              >
                <IcArrow/>
              </button>

              <span className="explore">
                Explore the collection
              </span>

            </div>

          </div>

          <div
            className="slide-img"
            style={{
              backgroundImage:"url("+SLIDE_IMGS[i]+")"
            }}
          >
            <div className="cap">
              KATY &amp; CINCO RANCH
            </div>
          </div>

        </div>
      </div>
    </section>
  );
}
/* ---------- cta ---------- */
function Cta(){
  return (
    <section id="cta" className="cta">
      <div className="wrap">
        <h2>Your Katy Home. Your Windows. A More Thoughtful Fit.</h2>
        <p>We bring the consultation to you, so you can see materials and explore options in the rooms where they'll actually live.</p>
        <div className="cta-btns">
          <a className="cta-gold" href="#consult"><IcCal/> Book Your Free In-Home Consultation</a>
          <a className="cta-out" href={"tel:"+PHONE}><IcPhone s={18}/> {PHONE}</a>
        </div>
      </div>
    </section>
  );
}

function Faq(){
  const [open,setOpen] = useState(0);
  const [showAll,setShowAll] = useState(false);

  const visibleFaqs = showAll ? FAQS : FAQS.slice(0,5);

  return (
    <section id="faq" className="pad faq">
      <div className="wrap">
        <div className="label">Questions</div>

        <h2>Local FAQs: Katy &amp; Cinco Ranch</h2>

        <div className="faq-list">
          {visibleFaqs.map((f,i)=>(
            <div
              className={"faq-item"+(open===i?" open":"")}
              key={i}
            >
              <button
                className="faq-q"
                onClick={()=>setOpen(open===i ? -1 : i)}
              >
                {f.q}
                <IcCaret className="fcaret"/>
              </button>

              <div className="faq-a">
                {f.a}
              </div>
            </div>
          ))}
        </div>

        {FAQS.length > 5 && (
          <button
            className="faq-read-more read-more"
            onClick={() => {
              setShowAll(!showAll);
              setOpen(-1);
            }}
          >
            {showAll ? "Read Less" : "Read More"}
          </button>
        )}

      </div>
    </section>
  );
}

/* ---------- footer ---------- */
function Footer(){
  return (
    <footer className="site">
      <div className="wrap">
        <div className="foot-grid">
          <div>
            <a href="/" className="foot-logo logo-image foot-logo-image" aria-label="Slick Blinds"><img src="https://slickblinds.com/_next/image/?url=https%3A%2F%2Fslickblindsprod.blob.core.windows.net%2Fassets%2Fassets%2Fslick_Blinds_Logo_2499f82cff.svg&w=256&q=75" alt="Slick Blinds" /></a>
            <p className="foot-about">Premium custom blinds and shades for every home. Expert consultation, professional installation, and Limited Lifetime Warranty included.</p>
            <div className="socials"><a href="#" aria-label="facebook"><IcFb/></a><a href="#" aria-label="instagram"><IcIg/></a></div>
            <a className="foot-phone" href={"tel:"+PHONE}><IcPhone s={16}/> {PHONE}</a>
          </div>
          {Object.entries(FOOT).map(([h,items])=>(
            <div className="foot-col" key={h}>
              <h4>{h}</h4>
              {items.map((item,i)=>{ const [label,href]=Array.isArray(item)?item:[item,"#"]; return <a href={href} key={i}>{label}</a>; })}
            </div>
          ))}
        </div>
        <div className="foot-bottom">
          <span>© 2026 Slick Blinds. All rights reserved.</span>
          <div className="links"><a href="#">Privacy Policy</a><a href="#">Terms of Service</a><a href="#">Warranty</a></div>
        </div>
      </div>
    </footer>
  );
}

function App(){
  return (<><Header/><Hero/><Range/><Slider/><Cta/><Faq/><Footer/></>);
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
